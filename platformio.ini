; gpxcam-t1000e – PlatformIO configuration.
; Toolchain, core and linker settings follow Meshtastic's T1000-E build
; (meshtastic/firmware variants/nrf52840/nrf52.ini @ 6d41e279f1f5), pinned to exact versions.

[platformio]
default_envs = t1000e
boards_dir = boards

[env:t1000e]
platform = platformio/nordicnrf52@10.12.0
framework = arduino
board = t1000-e
platform_packages =
  ; Meshtastic's fork of the Adafruit nRF52 core (S140 7.3.0 headers, C++17), pinned to a commit
  platformio/framework-arduinoadafruitnrf52 @ https://github.com/meshtastic/Adafruit_nRF52_Arduino.git#9ddcbc9568b12f102f9e88bd4d1b88ea789213a4
  platformio/toolchain-gccarmnoneeabi@~1.90301.0

; Variant and linker script live in this repo (application at 0x27000, S140 7.3.0)
board_build.variants_dir = variants
board_build.ldscript = variants/t1000-e/nrf52840_s140_v7.ld

build_type = release
build_flags =
  -Os
  -std=gnu++17
build_unflags =
  -Ofast
  -std=gnu++11

extra_scripts =
  post:tools/uf2_post.py

monitor_speed = 115200
