; gpxcam-t1000e – PlatformIO configuration.
; Toolchain, core and linker settings follow Meshtastic's T1000-E build
; (meshtastic/firmware variants/nrf52840/nrf52.ini @ 6d41e279f1f5), pinned to exact versions.

[platformio]
default_envs = t1000e
boards_dir = boards

[env:t1000e]
platform = platformio/nordicnrf52@10.12.0
framework = arduino
board = t1000-e
platform_packages =
  ; Meshtastic's fork of the Adafruit nRF52 core (S140 7.3.0 headers, C++17), pinned to a commit
  platformio/framework-arduinoadafruitnrf52 @ https://github.com/meshtastic/Adafruit_nRF52_Arduino.git#9ddcbc9568b12f102f9e88bd4d1b88ea789213a4
  platformio/toolchain-gccarmnoneeabi@~1.90301.0

; Variant and linker script live in this repo (application at 0x27000, S140 7.3.0)
board_build.variants_dir = variants
board_build.ldscript = variants/t1000-e/nrf52840_s140_v7.ld

build_type = release
build_flags =
  -Os
  -std=gnu++17
  ; Serial1 (GPS) receive buffer; the core's default is 64 B, about 5 ms at 115200 baud.
  ; Meshtastic uses 4096 (variants/nrf52840/nrf52840.ini); 1024 holds a burst of NMEA.
  -DSERIAL_BUFFER_SIZE=1024
  ; The internal file system (used by Bluefruit) lights LED_BUILTIN while writing flash
  ; (InternalFileSytem/src/flash/flash_cache.c). -1 makes that a no-op: digitalWrite()
  ; ignores pins >= PINS_COUNT. Meshtastic does the same (variants/nrf52840/nrf52840.ini).
  -DLED_BUILTIN=-1
  ; TinyUSB's handler of the USB power events waits without a limit and hung the card on a
  ; bouncing cable; every call goes through the guard in src/usb_power.cpp.
  -Wl,--wrap=tusb_hal_nrf_power_event
build_unflags =
  -Ofast
  -std=gnu++11

extra_scripts =
  pre:tools/version.py
  post:tools/uf2_post.py

; Never use nrfutil/J-Link/nrfjprog: "pio run -t upload" goes through the UF2 script only.
upload_protocol = custom
upload_command = tools/flash.sh $BUILD_DIR/firmware.uf2

monitor_speed = 115200

; Test build only, never released (default_envs builds t1000e alone): it adds the commands of
; GPXCAM_TEST_COMMANDS (src/diag.h), which damage stored data on purpose to test the repair.
; pio run -e t1000e_test
[env:t1000e_test]
extends = env:t1000e
build_flags =
  ${env:t1000e.build_flags}
  -DGPXCAM_TEST_COMMANDS

; Unit tests on the PC for the hardware-independent modules: pio test -e native
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
build_src_filter = +<nmea.cpp> +<lumix.cpp> +<camera_list.cpp> +<utc.cpp> +<pairing_record.cpp> +<link_policy.cpp> +<battery_rules.cpp> +<battery_batch.cpp> +<handle_cache.cpp> +<tz_table.cpp> +<posix_tz.cpp> +<tz_record.cpp> +<status_text.cpp> +<sound_rules.cpp> +<settings_record.cpp> +<pairing_copy_record.cpp> +<device_identity.cpp>
test_build_src = yes
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
