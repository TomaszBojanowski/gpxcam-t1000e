[package]
name = "gpxcam-card"
version = "1.4.0"
description = "Sets up a SenseCAP T1000-E running gpxcam over USB"
authors = ["Tomasz Bojanowski"]
license = "GPL-3.0-only"
repository = "https://github.com/TomaszBojanowski/gpxcam-t1000e"
edition = "2024"
rust-version = "1.85"

[lib]
name = "gpxcam_card_lib"
crate-type = ["rlib"] # desktop only: no mobile library

[build-dependencies]
serde_json = "1.0.154"
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serialport = "4.10.1"
socket2 = "0.6.5" # IP_MULTICAST_IF: the SSDP search leaves only through the camera's network
tauri = { version = "2.12.5", features = [] }

[dev-dependencies]
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.191" # a pseudo terminal standing in for the card's port

# clippy runs with -D warnings, so these are errors. A deliberate exception is
# #[expect(lint, reason = "...")] at the code. too_many_lines keeps clippy's limit of 100 lines.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
too_many_lines = "warn"
allow_attributes_without_reason = "warn"
match_same_arms = "warn"
option_option = "warn"
ref_option = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
redundant_else = "warn"
