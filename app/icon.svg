<?xml version="1.0" encoding="UTF-8"?>
<!-- gpxcam card: a camera with a location pin. 128 px GNOME icon grid, flat GNOME palette colours, no gradients. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- top bump and shutter button -->
  <rect x="30" y="18" width="40" height="22" rx="8" fill="#deddda"/>
  <rect x="10" y="24" width="14" height="10" rx="3" fill="#5e5c64"/>
  <!-- body -->
  <rect x="4" y="32" width="120" height="84" rx="20" fill="#f6f5f4"/>
  <!-- lower part a touch darker, for depth -->
  <path d="M4 76 H124 V96 A20 20 0 0 1 104 116 H24 A20 20 0 0 1 4 96 Z" fill="#deddda"/>
  <!-- dark strip under the top edge -->
  <rect x="14" y="42" width="100" height="8" rx="4" fill="#5e5c64"/>

  <!-- lens -->
  <circle cx="56" cy="80" r="33" fill="#241f31"/>
  <circle cx="56" cy="80" r="25" fill="#99c1f1"/>
  <circle cx="56" cy="80" r="22" fill="#3584e4"/>
  <circle cx="56" cy="80" r="12" fill="#1a5fb4"/>
  <circle cx="48" cy="71" r="4" fill="#ffffff"/>

  <!-- location pin -->
  <path d="M100 8 C85 8 74 19 74 34 C74 54 100 82 100 82 C100 82 126 54 126 34 C126 19 115 8 100 8 Z" fill="#e01b24"/>
  <circle cx="100" cy="34" r="10" fill="#ffffff"/>
</svg>
